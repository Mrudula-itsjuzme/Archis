name: Feature request
description: Propose a product or engineering improvement for Archis.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem are we solving?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful version of the idea.
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: Why this matters
      description: Who benefits, and what gets better?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope / constraints
      description: Dependencies, risks, things explicitly out of scope, or relevant links.
